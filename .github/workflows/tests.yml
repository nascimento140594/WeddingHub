name: Tests

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: weddinghub
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123456
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d weddinghub"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        env:
          SECRET_KEY: 7*)7a#d5%3lq6n+=#^zwbs-)3d(ikkol^=qon_qkv)7i2f)w#x
          DEBUG: "False"
          ALLOWED_HOSTS: 127.0.0.1,localhost
          DB_NAME: weddinghub
          DB_USER: postgres
          DB_PASSWORD: 123456
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          python manage.py migrate

      - name: Run tests
        env:
          SECRET_KEY: 7*)7a#d5%3lq6n+=#^zwbs-)3d(ikkol^=qon_qkv)7i2f)w#x
          DEBUG: "False"
          ALLOWED_HOSTS: 127.0.0.1,localhost
          DB_NAME: weddinghub
          DB_USER: postgres
          DB_PASSWORD: 123456
          DB_HOST: localhost
          DB_PORT: 5432
        run: |
          python manage.py test
