<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Excluir convidado | WeddingHub</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #fffdf9 0%,
                    #f8f1e8 100%
                );

            color: #4b4036;

            font-family:
                Georgia,
                "Times New Roman",
                serif;
        }

        .container {
            width: min(560px, 92%);
        }

        .header {
            margin-bottom: 30px;

            text-align: center;
        }

        .brand {
            margin: 0 0 8px;

            color: #b89b72;

            font-size: 14px;
            font-weight: 600;

            letter-spacing: 4px;

            text-transform: uppercase;
        }

        .title {
            margin: 0;

            color: #40352c;

            font-size: clamp(34px, 6vw, 48px);

            font-weight: 400;
        }

        .divider {
            width: 70px;
            height: 1px;

            margin: 20px auto 0;

            background: #c8a97e;
        }

        .card {
            padding: 35px;

            background: rgba(
                255,
                255,
                255,
                0.9
            );

            border: 1px solid #eadfd2;

            border-radius: 18px;

            box-shadow:
                0 10px 30px
                rgba(82, 64, 45, 0.06);

            text-align: center;
        }

        .warning {
            margin: 0 0 20px;

            color: #96645c;

            font-size: 30px;
        }

        .message {
            margin: 0 0 10px;

            color: #4b4036;

            font-size: 20px;
        }

        .guest-name {
            margin: 0 0 12px;

            color: #40352c;

            font-size: 25px;

            font-weight: 400;
        }

        .description {
            margin: 0;

            color: #8b7b6b;

            font-size: 14px;

            line-height: 1.6;
        }

        .actions {
            display: flex;

            justify-content: center;

            gap: 12px;

            margin-top: 30px;
        }

        .button {
            padding: 12px 22px;

            border-radius: 10px;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 14px;

            text-decoration: none;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .cancel {
            background: #fff;

            border: 1px solid #dfd0bd;

            color: #6d5d4d;
        }

        .cancel:hover {
            background: #f8f1e8;

            transform: translateY(-1px);
        }

        .delete {
            background: #96645c;

            border: 1px solid #96645c;

            color: #fff;
        }

        .delete:hover {
            background: #84564f;

            transform: translateY(-1px);
        }

        .footer {
            margin-top: 30px;

            color: #a49484;

            text-align: center;

            font-size: 13px;
        }

        @media (max-width: 600px) {

            .card {
                padding: 28px 20px;
            }

            .actions {
                flex-direction: column-reverse;
            }

            .button {
                width: 100%;

                text-align: center;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <header class="header">

        <p class="brand">
            WeddingHub
        </p>

        <h1 class="title">
            Laura &amp; Matheus
        </h1>

        <div class="divider"></div>

    </header>


    <div class="card">

        <div class="warning">
            ⚠
        </div>


        <p class="message">
            Deseja realmente excluir este convidado?
        </p>


        <h2 class="guest-name">
            {{ guest.full_name }}
        </h2>


        <p class="description">
            Esta ação removerá o convidado da sua lista.
            Essa operação não poderá ser desfeita.
        </p>


        <div class="actions">

            <a
                class="button cancel"
                href="{% url 'guests:guest-page' %}"
            >
                Cancelar
            </a>


            <form method="post">

                {% csrf_token %}

                <button
                    type="submit"
                    class="button delete"
                >
                    Excluir convidado
                </button>

            </form>

        </div>

    </div>


    <footer class="footer">

        WeddingHub · Laura &amp; Matheus

    </footer>

</div>

</body>

</html>
